<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>丹尼的機器人與感測器模組庫 | Danny's Hardware & Sensor Inventory</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0f19;
            --bg-card: #151c2c;
            --bg-card-hover: #1e293b;
            --bg-glass: rgba(21, 28, 44, 0.75);
            --border-color: #2a364f;
            --border-glow: #38bdf8;
            
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            
            --accent-cyan: #38bdf8;
            --accent-blue: #3b82f6;
            --accent-indigo: #6366f1;
            --accent-purple: #a855f7;
            --accent-emerald: #10b981;
            --accent-amber: #f59e0b;
            --accent-rose: #f43f5e;
            
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 18px;
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.4);
            --shadow-glow: 0 0 20px rgba(56, 189, 248, 0.2);
            --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(99, 102, 241, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
        }

        /* Top Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            padding: 1.25rem 2rem;
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-indigo));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 800;
            box-shadow: var(--shadow-glow);
        }

        .title-group h1 {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(to right, #f8fafc, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .title-group p {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .stats-badge {
            display: flex;
            gap: 0.75rem;
        }

        .stat-chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            padding: 0.4rem 0.8rem;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .stat-chip strong {
            color: var(--accent-cyan);
            font-weight: 700;
        }

        /* Controls Section */
        .controls-section {
            max-width: 1400px;
            margin: 2rem auto 1.5rem auto;
            padding: 0 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .search-wrapper {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1.25rem 1rem 3.25rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 1rem;
            transition: var(--transition-smooth);
            box-shadow: var(--shadow-card);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        .category-tabs {
            display: flex;
            gap: 0.6rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            scrollbar-width: thin;
        }

        .tab-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.6rem 1.2rem;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition-smooth);
        }

        .tab-btn:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
            border-color: var(--text-muted);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(99, 102, 241, 0.2));
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            font-weight: 600;
            box-shadow: var(--shadow-glow);
        }

        /* Grid Section */
        .inventory-grid {
            max-width: 1400px;
            margin: 0 auto 4rem auto;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .module-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: var(--transition-smooth);
            cursor: pointer;
            box-shadow: var(--shadow-card);
        }

        .module-card:hover {
            transform: translateY(-6px);
            border-color: var(--border-glow);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), var(--shadow-glow);
        }

        .card-image-wrap {
            position: relative;
            width: 100%;
            height: 220px;
            background: #070a12;
            overflow: hidden;
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .module-card:hover .card-image {
            transform: scale(1.06);
        }

        .card-badge {
            position: absolute;
            top: 0.75rem;
            left: 0.75rem;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--accent-cyan);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.25rem 0.6rem;
            border-radius: var(--radius-sm);
        }

        .photo-count-badge {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(8px);
            color: var(--text-secondary);
            font-size: 0.7rem;
            padding: 0.25rem 0.5rem;
            border-radius: var(--radius-sm);
        }

        .card-body {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title-en {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent-indigo);
            margin-bottom: 0.2rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .card-title-zh {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.75rem;
            line-height: 1.3;
        }

        .card-desc {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex-grow: 1;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-top: auto;
        }

        .tag {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
            font-size: 0.725rem;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-family: 'Fira Code', monospace;
        }

        .tag.arduino { color: #00979d; border-color: rgba(0, 151, 157, 0.3); }
        .tag.stm32 { color: #38bdf8; background: rgba(56, 189, 248, 0.1); border-color: rgba(56, 189, 248, 0.3); }

        /* Modal Dialog */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(7, 10, 18, 0.85);
            backdrop-filter: blur(12px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 1000px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-container {
            transform: scale(1);
        }

        .modal-header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            position: sticky;
            top: 0;
            background: var(--bg-card);
            z-index: 10;
        }

        .modal-title-wrap h2 {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .modal-title-wrap p {
            font-size: 0.9rem;
            color: var(--accent-cyan);
            font-weight: 500;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .close-btn:hover {
            background: var(--accent-rose);
            color: white;
            border-color: var(--accent-rose);
        }

        .modal-content {
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.25rem;
        }

        .gallery-card {
            background: rgba(7, 10, 18, 0.6);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: var(--transition-smooth);
            display: flex;
            flex-direction: column;
        }

        .gallery-card:hover {
            border-color: var(--border-glow);
            box-shadow: var(--shadow-glow);
            transform: translateY(-2px);
        }

        .gallery-img-wrap {
            height: 220px;
            background: #070a12;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .gallery-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .gallery-card:hover .gallery-img-wrap img {
            transform: scale(1.05);
        }

        .img-zoom-btn {
            position: absolute;
            inset: 0;
            background: rgba(11, 15, 25, 0.75);
            color: var(--accent-cyan);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.2s ease;
            backdrop-filter: blur(2px);
        }

        .gallery-img-wrap:hover .img-zoom-btn {
            opacity: 1;
        }

        .gallery-img-caption {
            padding: 0.75rem 1rem;
            background: #111827;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .caption-type {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent-cyan);
        }

        .caption-filename {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: 'Fira Code', monospace;
            word-break: break-all;
        }

        /* Lightbox CSS */
        .lightbox-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(10px);
            z-index: 3000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            padding: 2rem;
        }

        .lightbox-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox-img-container {
            max-width: 90vw;
            max-height: 80vh;
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            border: 1px solid var(--border-glow);
        }

        .lightbox-img-container img {
            width: 100%;
            height: 100%;
            max-height: 80vh;
            object-fit: contain;
            display: block;
        }

        .lightbox-caption-bar {
            margin-top: 1rem;
            text-align: center;
            color: var(--text-primary);
        }

        .lightbox-caption-bar h4 {
            font-size: 1.1rem;
            color: var(--accent-cyan);
            margin-bottom: 0.25rem;
        }

        .lightbox-caption-bar p {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-family: 'Fira Code', monospace;
        }

        .lightbox-close-btn {
            position: absolute;
            top: 1.5rem;
            right: 2rem;
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid var(--border-color);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-smooth);
        }

        .lightbox-close-btn:hover {
            background: var(--accent-rose);
            border-color: var(--accent-rose);
        }

        .section-block h3 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-block h3::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 16px;
            background: var(--accent-cyan);
            border-radius: 2px;
        }

        .wiring-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1.5rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .wiring-table th, .wiring-table td {
            padding: 0.75rem 1rem;
            text-align: left;
            font-size: 0.875rem;
            border-bottom: 1px solid var(--border-color);
        }

        .wiring-table th {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            font-weight: 600;
        }

        .wiring-table td {
            color: var(--text-primary);
            font-family: 'Fira Code', monospace;
        }

        .code-block {
            background: #070a12;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1.25rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            color: #e2e8f0;
            overflow-x: auto;
            white-space: pre;
            line-height: 1.5;
        }

        /* Empty State */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }

        .empty-state h3 {
            font-size: 1.25rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .lang-switch-btn {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(56, 189, 248, 0.2));
            border: 1px solid var(--accent-indigo);
            color: var(--accent-cyan);
            padding: 0.5rem 1rem;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: var(--transition-smooth);
        }

        .lang-switch-btn:hover {
            background: var(--accent-indigo);
            color: white;
            box-shadow: var(--shadow-glow);
        }

        @media (max-width: 768px) {
            header { padding: 1rem; }
            .controls-section { padding: 0 1rem; }
            .inventory-grid { padding: 0 1rem; }
            .modal-overlay { padding: 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo-group">
                <div class="logo-icon">⚡</div>
                <div class="title-group">
                    <h1>丹尼的機器人與感測器模組庫</h1>
                    <p>Danny's Hardware & Sensor Inventory Documentation (中英文對照版)</p>
                </div>
            </div>
            <div class="header-right">
                <a href="index_en.html" class="lang-switch-btn">🌐 切換至純英文版 (English Only)</a>
                <div class="stats-badge">
                    <div class="stat-chip">收錄模組：<strong id="stat-count">90</strong> 項</div>
                    <div class="stat-chip">支援平台：<strong>Arduino / STM32 / Pi</strong></div>
                </div>
            </div>
        </div>
    </header>

    <div class="controls-section">
        <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" class="search-input" placeholder="搜尋模組名稱、晶片（例如：MPU6050, Servo, PCA9685, 超音波, 循跡）...">
        </div>
        <div class="category-tabs" id="category-tabs">
            <button class="tab-btn active" data-cat="all">全部模組 (All)</button>
            <button class="tab-btn" data-cat="controllers">主控板 (Controllers)</button>
            <button class="tab-btn" data-cat="motion">運動驅動 (Motion & Servos)</button>
            <button class="tab-btn" data-cat="sensors">感測器 & 視覺 (Sensors & Vision)</button>
            <button class="tab-btn" data-cat="display_audio">顯示與音訊 (Display & Audio)</button>
            <button class="tab-btn" data-cat="power">電源與擴充板 (Power & Adapters)</button>
            <button class="tab-btn" data-cat="kit37">37合1模組套件 (37-in-1 Kit)</button>
        </div>
    </div>

    <main class="inventory-grid" id="inventory-grid">
        <!-- Cards injected dynamically via JS -->
    </main>

    <!-- Modal Dialog -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <div class="modal-title-wrap">
                    <h2 id="modal-title-zh">模組名稱</h2>
                    <p id="modal-title-en">Module Title EN</p>
                </div>
                <button class="close-btn" id="modal-close">&times;</button>
            </div>
            <div class="modal-content" id="modal-content">
                <!-- Modal content dynamically injected -->
            </div>
        </div>
    </div>

    <!-- Lightbox：全螢幕檢視原圖 -->
    <div class="lightbox-overlay" id="lightbox-overlay">
        <button class="lightbox-close-btn" id="lightbox-close">&times;</button>
        <div class="lightbox-img-container">
            <img id="lightbox-img" src="" alt="原始解析度圖片">
        </div>
        <div class="lightbox-caption-bar">
            <h4 id="lightbox-caption-type">照片分類</h4>
            <p id="lightbox-caption-filename">檔名</p>
        </div>
    </div>

    <script src="../data/modules.js"></script>
    <script>
        // Database of all items matched with actual photo files in Sensors_and_Accessories
        const MODULES_DATA = buildModules('zh', '../../');
// Helper: Extract photo caption from filename
        function getImageCaption(filename) {
            let type = '📷 模組實體照片 (Module Photo)';
            if (filename.includes('Front')) type = '📸 正面特寫與元件外觀 (Front View)';
            else if (filename.includes('Back')) type = '🔍 背面電路與腳位絲印 (Back View & Pinouts)';
            else if (filename.includes('Angle')) type = '📐 斜向 3D 立體視角 (Perspective View)';
            else if (filename.includes('CloseUp') || filename.includes('Pinout')) type = '🔎 腳位與晶片細節特寫 (Pinout Detail)';
            else if (filename.includes('Sheet') || filename.includes('Chart') || filename.includes('Diagram') || filename.includes('Guide')) type = '📋 規格對照參考圖表 (Reference Chart)';
            return { type, filename };
        }

        // Lightbox Functions
        const lightboxOverlay = document.getElementById('lightbox-overlay');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxCaptionType = document.getElementById('lightbox-caption-type');
        const lightboxCaptionFilename = document.getElementById('lightbox-caption-filename');
        const lightboxClose = document.getElementById('lightbox-close');

        function openLightbox(imgSrc, captionType) {
            lightboxImg.src = imgSrc;
            lightboxCaptionType.textContent = captionType;
            lightboxCaptionFilename.textContent = imgSrc;
            lightboxOverlay.classList.add('active');
        }

        function closeLightbox() {
            lightboxOverlay.classList.remove('active');
        }

        lightboxClose.onclick = closeLightbox;
        lightboxOverlay.onclick = (e) => {
            if (e.target === lightboxOverlay) closeLightbox();
        };

        // Render Cards
        const grid = document.getElementById('inventory-grid');
        const statCount = document.getElementById('stat-count');
        const searchInput = document.getElementById('search-input');
        const categoryTabs = document.getElementById('category-tabs');

        function renderGrid(filterCategory = 'all', searchQuery = '') {
            grid.innerHTML = '';
            
            const filtered = MODULES_DATA.filter(mod => {
                const matchCat = (filterCategory === 'all') || (mod.category === filterCategory);
                const query = searchQuery.toLowerCase().trim();
                const matchQuery = !query || 
                    mod.name.toLowerCase().includes(query) ||
                    mod.title.toLowerCase().includes(query) ||
                    mod.desc.toLowerCase().includes(query) ||
                    mod.tags.some(t => t.toLowerCase().includes(query));
                return matchCat && matchQuery;
            });

            statCount.textContent = filtered.length;

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <h3>未找到符合條件的模組</h3>
                        <p>請嘗試使用不同的搜尋關鍵字或切換分類標籤。</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(mod => {
                const card = document.createElement('div');
                card.className = 'module-card';
                card.onclick = () => openModal(mod);

                const coverImg = mod.images[0] || '22_SensorKit_37in1_Diagram_Chart.jpg';

                card.innerHTML = `
                    <div class="card-image-wrap">
                        <img src="${coverImg}" alt="${mod.name}" class="card-image" loading="lazy">
                        <span class="card-badge"># ${mod.number}</span>
                        <span class="photo-count-badge">📷 ${mod.images.length} 張照片解說</span>
                    </div>
                    <div class="card-body">
                        <div class="card-title-en">${mod.name}</div>
                        <div class="card-title-zh">${mod.title}</div>
                        <div class="card-desc">${mod.desc}</div>
                        <div class="tag-list">
                            ${mod.tags.map(t => `<span class="tag ${t.toLowerCase()}">${t}</span>`).join('')}
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        // Modal Logic
        const modalOverlay = document.getElementById('modal-overlay');
        const modalClose = document.getElementById('modal-close');
        const modalTitleZh = document.getElementById('modal-title-zh');
        const modalTitleEn = document.getElementById('modal-title-en');
        const modalContent = document.getElementById('modal-content');

        function openModal(mod) {
            modalTitleZh.textContent = mod.title;
            modalTitleEn.textContent = `${mod.name} (編號 #${mod.number})`;

            modalContent.innerHTML = `
                <div class="section-block">
                    <h3>模組實體照片</h3>
                    <div class="gallery-grid">
                        ${mod.images.map(img => `
                            <div class="gallery-img-wrap" onclick="openLightbox('${img}', getImageCaption('${img}').type)">
                                <img src="${img}" alt="${img}" loading="lazy">
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="section-block">
                    <h3>功能簡介與詳細說明</h3>
                    <p style="color: var(--text-secondary);">${mod.desc}</p>
                </div>

                <div class="section-block">
                    <h3>規格與硬體參數</h3>
                    <table class="wiring-table">
                        <tbody>
                            ${mod.specs.map(s => `
                                <tr>
                                    <td style="width: 30%; color: var(--text-secondary);">${s.label}</td>
                                    <td>${s.val}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>

                ${mod.arduinoWiring && mod.arduinoWiring.length > 0 ? `
                <div class="section-block">
                    <h3>Arduino 接線對照表</h3>
                    <table class="wiring-table">
                        <thead>
                            <tr><th>模組引腳 (Pin)</th><th>Arduino 腳位 (Connection)</th></tr>
                        </thead>
                        <tbody>
                            ${mod.arduinoWiring.map(w => `
                                <tr><td>${w.pin}</td><td>${w.conn}</td></tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
                ` : ''}

                ${mod.stm32Wiring && mod.stm32Wiring.length > 0 ? `
                <div class="section-block">
                    <h3>STM32 (Blue Pill) 接線對照表</h3>
                    <table class="wiring-table">
                        <thead>
                            <tr><th>模組引腳 (Pin)</th><th>STM32 腳位 (GPIO)</th></tr>
                        </thead>
                        <tbody>
                            ${mod.stm32Wiring.map(w => `
                                <tr><td>${w.pin}</td><td>${w.conn}</td></tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
                ` : ''}

                ${mod.codeSnippet ? `
                <div class="section-block">
                    <h3>測試與範例程式碼 (Sample Code)</h3>
                    <div class="code-block">${escapeHtml(mod.codeSnippet)}</div>
                </div>
                ` : ''}
            `;

            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        modalClose.onclick = closeModal;
        modalOverlay.onclick = (e) => {
            if (e.target === modalOverlay) closeModal();
        };

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;")
                      .replace(/"/g, "&quot;")
                      .replace(/'/g, "&#039;");
        }

        // Event Listeners
        let currentCat = 'all';

        categoryTabs.addEventListener('click', (e) => {
            if (e.target.classList.contains('tab-btn')) {
                document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                currentCat = e.target.dataset.cat;
                renderGrid(currentCat, searchInput.value);
            }
        });

        searchInput.addEventListener('input', (e) => {
            renderGrid(currentCat, e.target.value);
        });

        // Initial Render
        renderGrid();
    </script>
</body>
</html>
