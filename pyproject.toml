[project]
name = "carbot"
version = "0.1.0"
description = "Raspberry Pi 控制 NeZha 驅動板的小車與機械臂"
requires-python = ">=3.11"
dependencies = [
    "smbus2>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carbot"]

[tool.ruff]
line-length = 100
